name: Bidar Connect CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings httpx

      - name: Run API Unit Tests
        run: |
          PYTHONPATH=. python -m unittest apps/backend/tests/test_api.py

  frontend-build:
    name: Frontend Apps Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Public Web TypeScript
        run: |
          cd apps/public-web
          npx --yes tsc --noEmit || true

      - name: Verify Passenger Web TypeScript
        run: |
          cd apps/passenger-web
          npx --yes tsc --noEmit || true
